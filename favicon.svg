<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for visibility on any browser tab theme -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- ==================== CROWN / LEAVES (GREENS) ==================== -->
    <!-- Top central leaves -->
    <polygon points="256,40 220,135 256,120" fill="#65a30d" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,40 256,120 292,135" fill="#4d7c0f" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Top Left flare leaf -->
    <polygon points="190,75 220,135 150,140" fill="#a3e635" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="220,135 256,120 205,175" fill="#84cc16" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Top Right flare leaf -->
    <polygon points="322,75 292,135 362,140" fill="#4d7c0f" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="292,135 256,120 307,175" fill="#365314" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Outer Right high tip -->
    <polygon points="362,140 292,135 345,190" fill="#3f6212" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Mid leaves -->
    <polygon points="150,140 205,175 160,200" fill="#bef264" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="205,175 256,170 215,230" fill="#65a30d" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Central core leaf facets -->
    <polygon points="256,120 205,175 256,170" fill="#4d7c0f" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,120 256,170 307,175" fill="#365314" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Mid right leaves -->
    <polygon points="307,175 256,170 297,230" fill="#4d7c0f" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="345,190 307,175 352,205" fill="#1e3a10" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Lower Leaves collar -->
    <polygon points="160,200 215,230 165,240" fill="#84cc16" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="215,230 256,235 256,170" fill="#65a30d" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,170 256,235 297,230" fill="#4d7c0f" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="297,230 345,240 352,205" fill="#365314" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- ==================== PINEAPPLE BODY (YELLOWS & AMBERS) ==================== -->
    <!-- Top shoulder facets -->
    <polygon points="215,235 256,235 230,295 155,290" fill="#fde047" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,235 297,235 357,290 282,295" fill="#eab308" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,235 282,295 230,295" fill="#facc15" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Middle upper facets -->
    <polygon points="155,290 230,295 190,365 140,360" fill="#fbbf24" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="230,295 282,295 256,370 190,365" fill="#f59e0b" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="282,295 357,290 372,360 322,365" fill="#d97706" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="282,295 322,365 256,370" fill="#f59e0b" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Middle lower facets -->
    <polygon points="140,360 190,365 220,430 160,420" fill="#f59e0b" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="190,365 256,370 256,440 220,430" fill="#d97706" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="256,370 322,365 292,430 256,440" fill="#b45309" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="322,365 372,360 352,420 292,430" fill="#d97706" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Bottom base facets -->
    <polygon points="160,420 220,430 256,475 205,470" fill="#d97706" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="220,430 256,440 292,430 256,475" fill="#b45309" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="292,430 352,420 307,470 256,475" fill="#9a3412" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="205,470 256,475 307,470 256,490" fill="#c2410c" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
  </g>
</svg>
