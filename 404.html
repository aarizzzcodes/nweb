<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aariz | Software Engineer & Creative Developer</title>
  <meta name="description" content="Portfolio of Aariz — Full-Stack Engineer, IoT & Systems Developer." />
  <meta property="og:title" content="Aariz | Software Engineer & Creative Developer" />
  <meta property="og:description" content="Portfolio of Aariz — Full-Stack Engineer, IoT & Systems Developer." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/favicon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- GitHub Pages SPA URL Sanitizer -->
  <script>
    (function () {
      var search = window.location.search;
      if (search.indexOf('?/') !== -1 || search.indexOf('~and~') !== -1) {
        var cleanPath = window.location.pathname;
        window.history.replaceState(null, '', cleanPath);
      }
    })();
  </script>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
<body>
  <div id="root"></div>

  <!-- Vite entry for development and build bundling -->

  <!-- GitHub Pages Static Root Fallback:
       Active ONLY on GitHub Pages (*.github.io) if /src/main.tsx failed to load.
       Never executes in Vite dev environments or AI Studio preview. -->
  <script>
    (function () {
      var isGitHubPages = window.location.hostname.endsWith('github.io');
      if (!isGitHubPages) return;

      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && !window.__appMounted) {
          window.__appMounted = true;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/index.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }
      }, 800);
    })();
  </script>
</body>
</html>
